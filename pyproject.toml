[project]
name = "spectra-bot"
version = "0.1.0"
description = "Lightweight async QQ bot built directly on NapCat (OneBot v11)."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "pydantic>=2.10.0",
    "aiocqhttp>=1.4.4",
    "httpx>=0.28.0",
    "openai>=1.70.0",
    "tenacity>=9.0.0",
    "pillow>=11.0.0",
]

[project.scripts]
spectra = "spectra.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spectra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
